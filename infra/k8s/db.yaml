apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-sql
  namespace: moviemix
data:
  001_schema.sql: |
    -- MOVIEMIX-SCHEMA v1 (TMDb-free; uses IMDb/Trakt IDs)
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    -- Core titles
    CREATE TABLE IF NOT EXISTS titles (
      id SERIAL PRIMARY KEY,
      imdb_id TEXT UNIQUE,
      trakt_id INT,
      trakt_slug TEXT,
      name TEXT NOT NULL,
      year INT,
      plot TEXT,
      genres TEXT[],
      cast_names TEXT[],
      poster_url TEXT,
      popularity DOUBLE PRECISION,
      updated_at TIMESTAMP DEFAULT now()
    );

    -- Users
    CREATE TABLE IF NOT EXISTS users (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      email TEXT UNIQUE NOT NULL,
      pass_hash TEXT NOT NULL,
      created_at TIMESTAMP DEFAULT now()
    );

    -- Interactions (implicit/explicit)
    CREATE TABLE IF NOT EXISTS interactions (
      user_id UUID REFERENCES users(id) ON DELETE CASCADE,
      title_id INT REFERENCES titles(id) ON DELETE CASCADE,
      rating DOUBLE PRECISION,
      watched BOOLEAN DEFAULT FALSE,
      weight DOUBLE PRECISION DEFAULT 1.0,
      ts TIMESTAMP DEFAULT now(),
      PRIMARY KEY (user_id, title_id)
    );

    -- Wishlists
    CREATE TABLE IF NOT EXISTS wishlists (
      user_id UUID REFERENCES users(id) ON DELETE CASCADE,
      title_id INT REFERENCES titles(id) ON DELETE CASCADE,
      source TEXT CHECK (source IN ('app','trakt')) DEFAULT 'app',
      ts TIMESTAMP DEFAULT now(),
      PRIMARY KEY (user_id, title_id, source)
    );

    CREATE TABLE IF NOT EXISTS interaction_events (
      id BIGSERIAL PRIMARY KEY,
      user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      title_id INT REFERENCES titles(id) ON DELETE CASCADE,
      event TEXT NOT NULL,
      meta JSONB,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS ix_ie_user_created
      ON interaction_events(user_id, created_at DESC);

    CREATE TABLE IF NOT EXISTS reviews (
      id BIGSERIAL PRIMARY KEY,
      user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      title_id INT NOT NULL REFERENCES titles(id) ON DELETE CASCADE,
      rating DOUBLE PRECISION NOT NULL CHECK (rating >= 1 AND rating <= 5),
      review_text TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      UNIQUE (user_id, title_id)
    );

    CREATE INDEX IF NOT EXISTS ix_reviews_title_updated
      ON reviews(title_id, updated_at DESC);

    CREATE INDEX IF NOT EXISTS ix_reviews_user_updated
      ON reviews(user_id, updated_at DESC);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: moviemix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: POSTGRES_DB
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: dbdata
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/001_schema.sql
              subPath: 001_schema.sql
      volumes:
        - name: dbdata
          persistentVolumeClaim:
            claimName: dbdata-pvc
        - name: init-sql
          configMap:
            name: db-init-sql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dbdata-pvc
  namespace: moviemix
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: moviemix
spec:
  selector:
    app: db
  ports:
    - port: 5432
