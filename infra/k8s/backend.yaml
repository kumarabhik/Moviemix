apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: moviemix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: moviemix-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RECS_URL
              value: http://recommender:8001
            - name: POSTGRES_HOST
              value: db
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: POSTGRES_DB
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt_secret
            - name: ENABLE_TRAKT_IMPORT
              value: "1"
            - name: TRAKT_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: TRAKT_ACCESS_TOKEN
                  optional: true
            - name: TRAKT_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: TRAKT_REFRESH_TOKEN
                  optional: true
            - name: OMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: OMDB_API_KEY
            - name: TRAKT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: TRAKT_CLIENT_ID
            - name: TRAKT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: TRAKT_CLIENT_SECRET
            - name: TRAKT_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: TRAKT_REDIRECT_URI
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: moviemix
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
