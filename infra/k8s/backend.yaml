apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: moviemix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      # ✅ ADDED (optional): Prometheus scrape annotations
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: moviemix-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            # ---- Service endpoints ----
            - name: RECS_URL
              value: http://recommender:8001

            # ---- DB connection (explicit) ----
            - name: POSTGRES_HOST
              value: db
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: POSTGRES_DB

            # Many Node backends use DATABASE_URL; include it too
            - name: DATABASE_URL
              value: postgresql://admin:I4mGr00t@db:5432/moviemix

            # ✅ ADDED: JWT secret (requested)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt_secret

            # ✅ Trakt import wiring
            - name: ENABLE_TRAKT_IMPORT
              value: "1"
            - name: TRAKT_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: TRAKT_ACCESS_TOKEN

            # ---- External API keys ----
            - name: OMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: OMDB_API_KEY
            - name: TRAKT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: TRAKT_CLIENT_ID
            - name: TRAKT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: TRAKT_CLIENT_SECRET
            - name: TRAKT_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: TRAKT_REDIRECT_URI
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: moviemix
spec:
  selector:
    app: backend
  ports:
    # ✅ ADDED: name for the service port (nice-to-have)
    - name: http
      port: 8000
      targetPort: 8000
