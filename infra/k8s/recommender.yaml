apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommender
  namespace: moviemix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommender
  template:
    metadata:
      labels:
        app: recommender
    spec:
      initContainers:
        - name: seed-recommender-data
          image: ghcr.io/i4mgro0t/moviemix-recommender:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-lc"]
          args:
            - >
              if [ -z "$(ls -A /mnt/data 2>/dev/null)" ]; then
                echo "Seeding recommender data into PVC...";
                cp -r /app/data/. /mnt/data/;
              else
                echo "Reusing existing recommender PVC contents.";
              fi
          volumeMounts:
            - name: recommender-data
              mountPath: /mnt/data
      containers:
        - name: recommender
          image: ghcr.io/i4mgro0t/moviemix-recommender:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: DATABASE_URL
            - name: DATA_DIR
              value: /app/data
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          volumeMounts:
            - name: recommender-data
              mountPath: /app/data

      volumes:
        - name: recommender-data
          persistentVolumeClaim:
            claimName: recommender-data
---
apiVersion: v1
kind: Service
metadata:
  name: recommender
  namespace: moviemix
spec:
  selector:
    app: recommender
  ports:
    - port: 8001
      targetPort: 8001
