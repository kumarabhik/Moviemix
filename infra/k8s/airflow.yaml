apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-dags
  namespace: moviemix
data:
  build_embeddings.py: |
    from datetime import timedelta
    from airflow import DAG
    from airflow.providers.http.operators.http import SimpleHttpOperator
    from airflow.utils.dates import days_ago

    default_args = {
        "owner": "moviemix",
        "retries": 1,
        "retry_delay": timedelta(minutes=5),
    }

    with DAG(
        dag_id="build_embeddings_nightly",
        default_args=default_args,
        start_date=days_ago(1),
        schedule_interval="0 2 * * *",
        catchup=False,
        tags=["moviemix"],
    ) as dag:
        build = SimpleHttpOperator(
            task_id="call_recommender_build",
            http_conn_id="recommender_http",
            endpoint="/admin/build_embeddings",
            method="POST",
            headers={"Content-Type": "application/json"},
            data="{}",
            log_response=True,
        )

        build
  moviemix_seed.py: |
    from airflow import DAG
    from airflow.utils.dates import days_ago

    try:
        from airflow.providers.postgres.operators.postgres import PostgresOperator
    except ImportError as e:
        raise ImportError(
            "PostgresOperator not found. Install apache-airflow-providers-postgres."
        ) from e

    default_args = {"owner": "airflow", "depends_on_past": False}

    with DAG(
        dag_id="moviemix_seed_titles",
        description="Seed a few titles into moviemix.titles",
        start_date=days_ago(1),
        schedule=None,
        catchup=False,
        default_args=default_args,
        tags=["moviemix", "seed"],
    ) as dag:
        seed = PostgresOperator(
            task_id="seed_titles",
            postgres_conn_id="moviemix_pg",
            sql="""
            INSERT INTO titles (imdb_id, trakt_id, trakt_slug, name, year, plot, genres, poster_url, popularity)
            VALUES
            ('tt1375666', 1, 'inception-2010', 'Inception', 2010,
                'A thief who steals corporate secrets through dream-sharing tech.',
                ARRAY['Sci-Fi','Thriller'], NULL, 9.8),
            ('tt0816692', 2, 'interstellar-2014', 'Interstellar', 2014,
                'A team travels through a wormhole to ensure humanity''s survival.',
                ARRAY['Sci-Fi','Drama'], NULL, 9.5),
            ('tt4154796', 3, 'avengers-endgame-2019', 'Avengers: Endgame', 2019,
                'After the devastating events of Infinity War...',
                ARRAY['Action','Adventure'], NULL, 9.0)
            ON CONFLICT (imdb_id) DO NOTHING;
            """,
        )
  refresh_popular_titles.py: |
    from datetime import datetime, timedelta
    from airflow import DAG
    from airflow.providers.postgres.operators.postgres import PostgresOperator

    default_args = {"owner": "moviemix", "retries": 1, "retry_delay": timedelta(minutes=5)}

    with DAG(
        dag_id="refresh_popular_titles_nightly",
        default_args=default_args,
        start_date=datetime(2025, 1, 1),
        schedule_interval="0 3 * * *",
        catchup=False,
    ) as dag:
        refresh = PostgresOperator(
            task_id="refresh_popular",
            postgres_conn_id="moviemix_pg",
            sql="REFRESH MATERIALIZED VIEW popular_titles;",
        )
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: moviemix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      containers:
        - name: airflow
          image: apache/airflow:2.10.2
          command: ["bash", "-lc"]
          args:
            - >
              airflow db migrate &&
              if [ -n "$AIRFLOW_ADMIN_USER" ] && [ -n "$AIRFLOW_ADMIN_PASSWORD" ]; then
                airflow users create
                --username "$AIRFLOW_ADMIN_USER"
                --password "$AIRFLOW_ADMIN_PASSWORD"
                --firstname "${AIRFLOW_ADMIN_FIRSTNAME:-MovieMix}"
                --lastname "${AIRFLOW_ADMIN_LASTNAME:-Admin}"
                --role Admin
                --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true;
              fi &&
              airflow webserver & exec airflow scheduler
          env:
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW__WEBSERVER__BASE_URL
              value: "http://airflow:8080"
            - name: AIRFLOW_UID
              value: "50000"
            - name: AIRFLOW_CONN_MOVIEMIX_PG
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: DATABASE_URL
            - name: AIRFLOW_CONN_RECOMMENDER_HTTP
              value: http://recommender:8001
            - name: AIRFLOW_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: AIRFLOW_ADMIN_USER
                  optional: true
            - name: AIRFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: AIRFLOW_ADMIN_PASSWORD
                  optional: true
            - name: AIRFLOW_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: moviemix-secrets
                  key: AIRFLOW_ADMIN_EMAIL
                  optional: true
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: airflow-dags
              mountPath: /opt/airflow/dags
      volumes:
        - name: airflow-dags
          configMap:
            name: airflow-dags
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: moviemix
spec:
  selector:
    app: airflow
  ports:
    - port: 8080
