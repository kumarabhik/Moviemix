apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: moviemix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: moviemix-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_ORIGIN
              value: http://backend:8000
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"

            # ✅ ADDED (as requested): A/B flag
            - name: ENABLE_AB_TEST
              value: "1"

          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: moviemix
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    # ✅ ADDED (nice-to-have, does not change behavior)
    - name: http
      port: 3000
      nodePort: 30000
