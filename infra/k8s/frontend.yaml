apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: moviemix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: moviemix-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_ORIGIN
              value: http://backend:8000
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: ENABLE_AB_TEST
              value: "1"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: moviemix
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      nodePort: 30000
