services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      RECS_URL: http://recommender:8001
      OMDB_API_KEY: ${OMDB_API_KEY}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET}
      TRAKT_REDIRECT_URI: ${TRAKT_REDIRECT_URI}
    depends_on:
      db:
        condition: service_healthy
      recommender:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  recommender:
    build: ../recommender
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ../recommender/data:/app/data
      - ../vector_data:/app/vector
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      args:
        BACKEND_ORIGIN: http://backend:8000
        NEXT_PUBLIC_ENABLE_AB_TEST: ${NEXT_PUBLIC_ENABLE_AB_TEST}
        NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: ${NEXT_PUBLIC_ENABLE_GOOGLE_AUTH}
    restart: unless-stopped
    env_file: ../.env
    environment:
      BACKEND_ORIGIN: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
      ENABLE_AB_TEST: ${ENABLE_AB_TEST}
      NEXT_PUBLIC_ENABLE_AB_TEST: ${NEXT_PUBLIC_ENABLE_AB_TEST}
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: ${NEXT_PUBLIC_ENABLE_GOOGLE_AUTH}
      NEXT_PUBLIC_ENABLE_WATCH_LINKS: ${NEXT_PUBLIC_ENABLE_WATCH_LINKS}
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  airflow:
    image: apache/airflow:2.10.2
    restart: unless-stopped
    env_file: ../.env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__BASE_URL: "http://localhost:8080"
      AIRFLOW_UID: "50000"
      AIRFLOW_CONN_MOVIEMIX_PG: ${DATABASE_URL}
    user: "50000:0"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      - airflowdata:/opt/airflow
    command:
      [
        "bash",
        "-lc",
        "airflow db init && airflow users create --username admin --password admin --firstname A --lastname K --role Admin --email admin@example.com && airflow webserver & airflow scheduler"
      ]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata: {}
  airflowdata: {}
  caddy_data: {}
  caddy_config: {}
