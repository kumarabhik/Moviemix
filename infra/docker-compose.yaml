# MOVIEMIX-SCAFFOLD: compose v0

services:
  db:
    image: postgres:16
    container_name: moviemix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro

  backend:
    build: ../backend
    container_name: moviemix-backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      RECS_URL: "http://recommender:8001"
      OMDB_API_KEY: "${OMDB_API_KEY}"
      TRAKT_CLIENT_ID: "${TRAKT_CLIENT_ID}"
      TRAKT_CLIENT_SECRET: "${TRAKT_CLIENT_SECRET}"
      TRAKT_REDIRECT_URI: "${TRAKT_REDIRECT_URI}"
    ports: ["8000:8000"]
    depends_on: [db, recommender]

  recommender:
    build: ../recommender
    container_name: moviemix-recommender
    restart: unless-stopped
    env_file: ../.env
    ports: ["8001:8001"]
    volumes:
      - ../recommender/data:/app/data
      - ../vector_data:/app/vector

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_ENABLE_AB_TEST: ${NEXT_PUBLIC_ENABLE_AB_TEST}
    container_name: moviemix-frontend
    restart: unless-stopped

    # ✅ IMPORTANT: load .env for frontend container too
    env_file: ../.env

    environment:
      - BACKEND_ORIGIN=http://backend:8000   # used by next.config.js rewrites
      - NEXT_TELEMETRY_DISABLED=1
      - ENABLE_AB_TEST=${ENABLE_AB_TEST}
      - NEXT_PUBLIC_ENABLE_AB_TEST=${NEXT_PUBLIC_ENABLE_AB_TEST}

      # ✅ ensure this exists at runtime inside the container
      - NEXT_PUBLIC_ENABLE_WATCH_LINKS=${NEXT_PUBLIC_ENABLE_WATCH_LINKS}
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  airflow:
    image: apache/airflow:2.10.2
    container_name: moviemix-airflow
    restart: unless-stopped
    env_file: ../.env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__BASE_URL: "http://localhost:8080"
      AIRFLOW_UID: "50000"
      AIRFLOW_CONN_MOVIEMIX_PG: "${DATABASE_URL}"
    user: "50000:0"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      - airflowdata:/opt/airflow
    ports: ["8080:8080"]
    command:
      [
        "bash",
        "-lc",
        "airflow db init && airflow users create --username admin --password admin --firstname A --lastname K --role Admin --email admin@example.com && airflow webserver & airflow scheduler"
      ]

volumes:
  dbdata: {}
  airflowdata: {}
